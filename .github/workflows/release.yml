name: Release Helm Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gke-deployment-chart/**"
      - "artifacthub-repo.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint chart
        run: helm lint gke-deployment-chart/ -f gke-deployment-chart/ci/default-values.yaml --strict

      - name: Template chart (dry-run render)
        run: helm template my-release gke-deployment-chart/ -f gke-deployment-chart/ci/default-values.yaml

      - name: Package chart
        run: helm package gke-deployment-chart/ --destination /tmp/helm-pkg

      - name: Verify package
        run: ls -lh /tmp/helm-pkg/


  release:
    name: Release to GitHub Pages
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install chart-releaser CLI
        run: |
          CR_VERSION="1.6.1"
          curl -sSLo cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/v${CR_VERSION}/chart-releaser_${CR_VERSION}_linux_amd64.tar.gz"
          tar -xzf cr.tar.gz cr
          sudo mv cr /usr/local/bin/cr

      - name: Reset gh-pages to clean Helm repo state
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          # Package chart
          helm package gke-deployment-chart/ --destination .cr-release-packages

          # Upload release (skip if already exists)
          cr upload \
            --owner "${OWNER}" \
            --git-repo "${REPO_NAME}" \
            --token "${CR_TOKEN}" \
            --packages-with-index \
            --skip-existing \
            --push

          # Force-reset gh-pages to clean orphan with only index.yaml + .tgz + metadata
          git fetch origin gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages-new
          git rm -rf . >/dev/null 2>&1 || true

          # Generate index.yaml into current (empty) directory
          cr index \
            --owner "${OWNER}" \
            --git-repo "${REPO_NAME}" \
            --token "${CR_TOKEN}" \
            --index-path index.yaml \
            --packages-with-index

          # Add artifacthub metadata
          cp artifacthub-repo.yml . 2>/dev/null || true
          touch .nojekyll

          git add index.yaml artifacthub-repo.yml .nojekyll 2>/dev/null || true
          git add "*.tgz" 2>/dev/null || true
          git commit -m "chore: publish Helm index"

          # Force-push as gh-pages
          git push origin gh-pages-new:gh-pages --force

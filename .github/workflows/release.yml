name: Release Helm Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gke-deployment-chart/**"
      - "artifacthub-repo.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint chart
        run: helm lint gke-deployment-chart/ -f gke-deployment-chart/ci/default-values.yaml --strict

      - name: Template chart (dry-run render)
        run: helm template my-release gke-deployment-chart/ -f gke-deployment-chart/ci/default-values.yaml

      - name: Package chart
        run: helm package gke-deployment-chart/ --destination /tmp/helm-pkg

      - name: Verify package
        run: ls -lh /tmp/helm-pkg/


  release:
    name: Release to GitHub Pages
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git checkout --orphan gh-pages
            git commit --allow-empty -m "chore: initialize gh-pages"
            git push origin gh-pages
            git checkout "${GITHUB_SHA}"
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: .
          config: .cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Copy ArtifactHub repo metadata to gh-pages
        run: |
          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          cp -f /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/artifacthub-repo.yml . 2>/dev/null || true
          git add artifacthub-repo.yml || true
          git diff --cached --quiet || git commit -m "chore: sync artifacthub-repo.yml"
          git push origin gh-pages || true

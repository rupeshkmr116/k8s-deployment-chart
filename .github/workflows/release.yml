name: Release Helm Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gke-deployment-chart/**"
      - "artifacthub-repo.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint chart
        run: helm lint gke-deployment-chart/ -f gke-deployment-chart/ci/default-values.yaml --strict

      - name: Template chart (dry-run render)
        run: helm template my-release gke-deployment-chart/ -f gke-deployment-chart/ci/default-values.yaml

      - name: Package chart
        run: helm package gke-deployment-chart/ --destination /tmp/helm-pkg

      - name: Verify package
        run: ls -lh /tmp/helm-pkg/


  release:
    name: Release to GitHub Pages
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package chart
        run: helm package gke-deployment-chart/ --destination /tmp/helm-pkg

      - name: Publish to gh-pages
        run: |
          # Checkout gh-pages into a temp directory
          git fetch origin gh-pages || true
          git worktree add /tmp/gh-pages gh-pages 2>/dev/null || \
            git worktree add /tmp/gh-pages --orphan gh-pages

          # Copy chart package
          cp /tmp/helm-pkg/*.tgz /tmp/gh-pages/

          # Regenerate index.yaml from scratch using all .tgz in gh-pages
          helm repo index /tmp/gh-pages \
            --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          # Copy ArtifactHub metadata and add .nojekyll
          cp artifacthub-repo.yml /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll

          # Commit and push
          cd /tmp/gh-pages
          git add index.yaml *.tgz artifacthub-repo.yml .nojekyll
          git diff --cached --quiet || git commit -m "chore: release ${{ github.ref_name }}"
          git push origin gh-pages

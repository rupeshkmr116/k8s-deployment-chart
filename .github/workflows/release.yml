name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - "gke-deployment-chart/**"
      - "artifacthub-repo.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Set up Python (for chart-testing)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Lint charts
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --chart-dirs . --charts gke-deployment-chart

  release:
    name: Release to GitHub Pages
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: .
          config: .cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Copy ArtifactHub repo metadata to gh-pages
        run: |
          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          cp -f /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/artifacthub-repo.yml . 2>/dev/null || true
          git add artifacthub-repo.yml || true
          git diff --cached --quiet || git commit -m "chore: sync artifacthub-repo.yml"
          git push origin gh-pages || true

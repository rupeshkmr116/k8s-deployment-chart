{{- if .Values.networkPolicy.enabled }}
{{- $defaultDeny := (.Values.networkPolicy.defaultDeny | default false) -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gke-deployment-chart.fullname" . }}-netpol
  labels:
    {{- include "gke-deployment-chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gke-deployment-chart.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- if .Values.networkPolicy.policyTypes }}
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
    {{- else }}
    - Ingress
    - Egress
    {{- end }}
  {{- if .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  {{- else if $defaultDeny }}
  ingress: []
  {{- else }}
  ingress:
    - from:
      - namespaceSelector: {}
      - podSelector: {}
      ports:
      - protocol: TCP
        port: {{ .Values.service.targetPort }}
  {{- end }}
  {{- if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- else if $defaultDeny }}
  egress: []
  {{- else }}
  egress:
    - {}  # Allow all egress traffic by default
  {{- end }}
{{- end }}

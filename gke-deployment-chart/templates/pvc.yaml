{{- if .Values.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gke-deployment-chart.fullname" . }}-pvc
  labels:
    {{- include "gke-deployment-chart.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.pvc.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.pvc.size | default "1Gi" }}
  storageClassName: {{ .Values.pvc.storageClassName | default "standard" }}
{{- end }}


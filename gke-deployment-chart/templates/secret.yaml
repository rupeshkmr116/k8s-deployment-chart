{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gke-deployment-chart.fullname" . }}-secret
  labels:
    {{- include "gke-deployment-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.fromFile }}
    {{- $fileContent := .Values.secret.fromFile }}
    {{- range $line := (splitList "\n" $fileContent) }}
      {{- $t := (trim $line) }}
      {{- if and $t (not (hasPrefix "#" $t)) (contains "=" $t) }}
        {{- $kv := splitList "=" $t }}
        {{- if ge (len $kv) 2 }}
          {{- $k := (index $kv 0 | trim) }}
          {{- $v := (join "=" (rest $kv) | trim) }}
  {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}

  {{- if .Values.secret.inline }}
    {{- range $key, $val := .Values.secret.inline }}
  {{ $key }}: {{ $val | quote }}
    {{- end }}
  {{- end }}
{{- end }}

---
{{- if and .Values.secret.enabled .Values.secret.settings }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gke-deployment-chart.fullname" . }}-secrets-settings
  labels:
    {{- include "gke-deployment-chart.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.secret.settings }}
    {{- if kindIs "string" $val }}
  {{ $key }}.json: {{ $val | b64enc | quote }}
    {{- else }}
  {{ $key }}.json: {{ $val | toString | b64enc | quote }}
    {{- end }}
  {{- end }}
{{- end }}

---
{{- if and .Values.secret.enabled .Values.secret.files }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gke-deployment-chart.fullname" . }}-secrets-files
  labels:
    {{- include "gke-deployment-chart.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.secret.files }}
    {{- if $val.value }}
      {{- $fileValue := $val.value }}
      {{- $content := "" }}
      {{- if kindIs "string" $fileValue }}
        {{- /* Try to read from file if it exists, otherwise use the value as-is */}}
        {{- if $.Files.Get $fileValue }}
          {{- $content = $.Files.Get $fileValue }}
        {{- else }}
          {{- $content = $fileValue }}
        {{- end }}
      {{- else }}
        {{- $content = $fileValue | toString }}
      {{- end }}
  {{ $key }}.{{ $val.extension }}: {{ $content | b64enc | quote }}
    {{- end }}
  {{- end }}
{{- end }}

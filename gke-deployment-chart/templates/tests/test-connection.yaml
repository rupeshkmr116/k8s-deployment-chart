apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gke-deployment-chart.fullname" . }}-test-connection"
  labels:
    {{- include "gke-deployment-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.35
      command: ['wget']
      args: ['--spider', '--timeout=10', 'http://{{ include "gke-deployment-chart.fullname" . }}-service:{{ .Values.ingress.port | default 80 }}/']
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}


apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gke-deployment-chart.fullname" . }}-test-readiness"
  labels:
    {{- include "gke-deployment-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.1.2
      command: ['sh', '-c']
      args:
        - |
          set -e
          echo "Testing readiness probe endpoint..."
          curl -f --max-time 10 http://{{ include "gke-deployment-chart.fullname" . }}-service:{{ .Values.ingress.port | default 80 }}/ || exit 1
          echo "Readiness probe test passed!"
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}


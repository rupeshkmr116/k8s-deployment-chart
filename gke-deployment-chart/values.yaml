# tolerations:
#   - key: "key"
#     operator: "Equal"
#     value: "value"
#     effect: "NoSchedule"

# this is for setting up a affinity more information can be found here: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
affinity: {}
# affinity:
#   nodeAffinity:
#     required:
#       nodeSelectorTerm:
#         - matchExpressions:
#           - key: "key"
#             operator: "Equal"
#             values: ["value"]

# Schedule pods across nodes (avoid all replicas on one node)
podAntiAffinity:
  enabled: true
  # topologyKey: "kubernetes.io/hostname"
